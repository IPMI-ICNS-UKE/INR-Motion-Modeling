[project]
name = "inrmm"
version = "0.1.0"
description = "Implicit neural respiratory motion models for 4D radiotherapy"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Johannes B. Gebauer" },
    { name = "Laura E. Büttgen" },
    { name = "Thilo Sentker" },
    { name = "René Werner" },
]
keywords = [
    "4DCT",
    "implicit neural representation",
    "medical image registration",
    "motion modelling",
    "radiotherapy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "aim<4",
    "matplotlib>=3.5.3",
    "monai>=1.2",
    "numpy>=1.23.3",
    "pillow>=9.4.0",
    "pyyaml>=6.0.3",
    "scipy>=1.9.3",
    "simpleitk>=2.0.2",
    "torch>=1.13.1",
    "tqdm>=4.64.1",
]

[project.urls]
Homepage = "https://github.com/IPMI-ICNS-UKE/INR-Motion-Modeling"
Repository = "https://github.com/IPMI-ICNS-UKE/INR-Motion-Modeling"
Issues = "https://github.com/IPMI-ICNS-UKE/INR-Motion-Modeling/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14.6"]
segmentation = ["totalsegmentator>=2.11,<3"]
vroc = [
    "vroc @ git+https://github.com/IPMI-ICNS-UKE/vroc.git",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
